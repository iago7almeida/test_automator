[pytest]
addopts = -ra -q -s --headed
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
env_files = envs/hml/.env
log_cli = true
log_cli_level = INFO
; env_files = envs/prod/.env

markers =
	backend: tests that exercise backend APIs
	frontend: browser / Playwright UI tests
	mobile: mobile tests (scaffold)
